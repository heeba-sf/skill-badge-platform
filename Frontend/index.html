<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Skill Badge Platform — Connexion</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:wght@600;700&family=JetBrains+Mono:wght@400;500&family=Source+Sans+Pro:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- ========================================== -->
  <!-- CSS DESIGN SYSTEM & REUSABLE VARIABLES     -->
  <!-- ========================================== -->
  <style>
    :root {
      /* Security-Themed Color Palette */
      --base-navy: #0A1E2C;
      --surface-slate: #1B2E3B;
      --content-white: #F8FAFC;
      --verification-gold: #C4A052;
      --success-emerald: #2E7D32;
      --text-charcoal: #2D3748;
      --text-muted: #64748B;
      --border-color: #334E5E;
      --border-focus: #C4A052;

      /* Typography */
      --font-display: 'IBM Plex Serif', serif;
      --font-body: 'Source Sans Pro', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;

      /* Spacing & Layout */
      --spacing-sm: 0.5rem;
      --spacing-md: 1rem;
      --spacing-lg: 1.5rem;
      --spacing-xl: 2rem;
      --container-max: 500px;

      /* Transitions */
      --transition: all 0.15s ease;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-body);
      background-color: var(--base-navy);
      color: var(--content-white);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }

    /* Typography */
    h1, h2, h3, h4 {
      font-family: var(--font-display);
      font-weight: 700;
      color: var(--content-white);
      letter-spacing: -0.01em;
    }
    p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    /* Secure Portal Layout */
    .auth-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--spacing-xl);
      background: var(--base-navy);
    }

    .auth-card {
      width: 100%;
      max-width: var(--container-max);
      background: var(--surface-slate);
      border: 2px solid var(--border-color);
      padding: var(--spacing-xl);
      position: relative;
    }

    .auth-header {
      text-align: center;
      margin-bottom: var(--spacing-xl);
    }

    .auth-icon-badge {
      font-size: 2.5rem;
      margin-bottom: var(--spacing-md);
      color: var(--verification-gold);
    }

    /* Security Clearance Role Cards */
    .role-selection-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--spacing-md);
      margin-bottom: var(--spacing-lg);
    }

    .role-card {
      border: 2px solid var(--border-color);
      padding: var(--spacing-lg);
      text-align: center;
      cursor: pointer;
      transition: var(--transition);
      background: var(--base-navy);
    }

    .role-card:hover {
      border-color: var(--verification-gold);
    }

    .role-card.selected {
      border-color: var(--verification-gold);
      background: rgba(196, 160, 82, 0.1);
    }

    .role-card:focus {
      outline: 2px solid var(--verification-gold);
      outline-offset: 2px;
    }

    .role-card-icon {
      font-size: 1.75rem;
      margin-bottom: var(--spacing-sm);
    }

    .role-card h4 {
      font-family: var(--font-body);
      font-size: 0.95rem;
      font-weight: 600;
      margin-bottom: var(--spacing-sm);
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.95rem;
      font-weight: 600;
      padding: 0.875rem 1.5rem;
      border: 2px solid transparent;
      cursor: pointer;
      transition: var(--transition);
      text-decoration: none;
      font-family: var(--font-body);
      width: 100%;
    }

    .btn-primary {
      background: var(--verification-gold);
      color: var(--base-navy);
      border-color: var(--verification-gold);
    }

    .btn-primary:hover {
      background: #D4B362;
      border-color: #D4B362;
    }

    .btn-primary:focus {
      outline: 2px solid var(--verification-gold);
      outline-offset: 2px;
    }

    .btn-secondary {
      background: transparent;
      border-color: var(--border-color);
      color: var(--content-white);
    }

    .btn-secondary:hover {
      border-color: var(--verification-gold);
      color: var(--verification-gold);
    }

    .btn-secondary:focus {
      outline: 2px solid var(--verification-gold);
      outline-offset: 2px;
    }

    .btn-block {
      width: 100%;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Forms & Inputs */
    .form-group {
      margin-bottom: var(--spacing-lg);
    }

    .form-group label {
      display: block;
      font-size: 0.875rem;
      font-weight: 600;
      margin-bottom: var(--spacing-sm);
      color: var(--content-white);
      font-family: var(--font-body);
    }

    .form-control {
      width: 100%;
      padding: 0.875rem 1rem;
      font-size: 0.95rem;
      border: 2px solid var(--border-color);
      background: var(--base-navy);
      color: var(--content-white);
      outline: none;
      transition: var(--transition);
      font-family: var(--font-body);
    }

    .form-control:focus {
      border-color: var(--verification-gold);
    }

    .form-control::placeholder {
      color: var(--text-muted);
    }

    /* Domain Checkboxes */
    .domain-checkboxes {
      display: grid;
      grid-template-columns: 1fr;
      gap: var(--spacing-sm);
      margin-bottom: var(--spacing-md);
      max-height: 200px;
      overflow-y: auto;
      padding: var(--spacing-md);
      border: 2px solid var(--border-color);
      background: var(--base-navy);
    }

    .checkbox-item {
      display: flex;
      align-items: center;
      gap: var(--spacing-sm);
      padding: var(--spacing-sm);
      cursor: pointer;
      font-size: 0.875rem;
      color: var(--content-white);
    }

    .checkbox-item input {
      accent-color: var(--verification-gold);
      width: 1rem;
      height: 1rem;
    }

    /* Alerts */
    .alert {
      padding: var(--spacing-md);
      border: 2px solid transparent;
      font-size: 0.9rem;
      margin-bottom: var(--spacing-lg);
      display: none;
      align-items: center;
      gap: var(--spacing-sm);
      font-family: var(--font-body);
    }

    .alert-error {
      background: rgba(239, 68, 68, 0.1);
      color: #FCA5A5;
      border-color: #EF4444;
    }

    .alert-success {
      background: rgba(46, 125, 50, 0.1);
      color: #86EFAC;
      border-color: #2E7D32;
    }

    /* Utility */
    .hidden {
      display: none !important;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .auth-wrapper {
        padding: var(--spacing-md);
      }

      .auth-card {
        padding: var(--spacing-lg);
      }

      .role-selection-grid {
        grid-template-columns: 1fr;
      }
    }

    /* Accessibility Focus States */
    *:focus-visible {
      outline: 2px solid var(--verification-gold);
      outline-offset: 2px;
    }
  </style>
</head>
<body>

  <!-- ========================================== -->
  <!-- AUTHENTICATION & LOGIN/SIGNUP MODULE       -->
  <!-- ========================================== -->
  <div id="auth-section" class="auth-wrapper">
    <div class="auth-card">
      <div id="auth-alert" class="alert alert-error"></div>

      <!-- Welcome View -->
      <div id="auth-choice-view">
        <div class="auth-header">
          <img src="logo1.png" alt="Skill Badge Platform Logo" style="height: 60px; margin-bottom: var(--spacing-md);" />
          <h2 style="color: var(--verification-gold); font-size: 2rem; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 700;">Skill Badge Platform</h2>
          <p style="margin-top: var(--spacing-sm);">Évaluation de compétences et certification cryptographique</p>
        </div>
        <button id="btn-show-login" class="btn btn-primary btn-block" style="margin-bottom: var(--spacing-md);">Se connecter</button>
        <button id="btn-show-register" class="btn btn-secondary btn-block">Créer un compte</button>
      </div>

      <!-- Login View -->
      <div id="auth-login-view" class="hidden">
        <div class="auth-header" style="margin-bottom: var(--spacing-xl);">
          <h2>Connexion</h2>
          <p style="margin-top: var(--spacing-sm);">Accédez à votre espace sécurisé</p>
        </div>

        <form id="form-login">
          <div class="form-group">
            <label for="login-email">Adresse Email</label>
            <input type="email" id="login-email" class="form-control" required placeholder="nom@exemple.tn" autocomplete="username" />
          </div>
          <div class="form-group">
            <label for="login-password">Mot de passe</label>
            <input type="password" id="login-password" class="form-control" required placeholder="••••••••" autocomplete="current-password" />
          </div>
          <button type="submit" id="login-submit-btn" class="btn btn-primary btn-block">Se connecter</button>
        </form>
        <div style="text-align: center; margin-top: var(--spacing-lg);">
          <button id="btn-back-to-choice-from-login" class="btn btn-secondary" style="font-size: 0.85rem; padding: 0.5rem 1rem;">← Retour</button>
        </div>
      </div>

      <!-- Multi-step Registration View -->
      <div id="auth-register-view" class="hidden">
        <div class="auth-header" style="margin-bottom: var(--spacing-lg);">
          <h2>Inscription</h2>
          <p id="register-step-subtitle" style="margin-top: var(--spacing-sm);">Étape 1 : Choisissez votre niveau d'accès</p>
        </div>

        <!-- Step 1: Role Selection -->
        <div id="register-step-1">
          <div class="role-selection-grid">
            <div class="role-card selected" id="role-choice-student" tabindex="0">
              <div class="role-card-icon">👨‍🎓</div>
              <h4>Étudiant</h4>
              <p style="font-size: 0.75rem; margin-top: var(--spacing-sm);">Évaluations & Badges</p>
            </div>
            <div class="role-card" id="role-choice-instructor" tabindex="0">
              <div class="role-card-icon">👨‍🏫</div>
              <h4>Instructeur</h4>
              <p style="font-size: 0.75rem; margin-top: var(--spacing-sm);">Supervision & Domaines</p>
            </div>
          </div>
          <button id="btn-reg-to-step-2" class="btn btn-primary btn-block">Continuer</button>
        </div>

        <!-- Step 2: Credentials & Domains -->
        <div id="register-step-2" class="hidden">
          <div class="form-group">
            <label for="reg-fullname">Nom complet</label>
            <input type="text" id="reg-fullname" class="form-control" required placeholder="Jean Dupont" autocomplete="name" />
          </div>
          <div class="form-group">
            <label for="reg-email">Email</label>
            <input type="email" id="reg-email" class="form-control" required placeholder="nom@domaine.tn" autocomplete="email" />
          </div>
          <div class="form-group">
            <label for="reg-password">Mot de passe</label>
            <input type="password" id="reg-password" class="form-control" required placeholder="••••••••" autocomplete="new-password" />
          </div>
          <div class="form-group">
            <label for="reg-password-confirm">Confirmer le mot de passe</label>
            <input type="password" id="reg-password-confirm" class="form-control" required placeholder="••••••••" autocomplete="new-password" />
          </div>

          <!-- Step 3 (Optional - Instructor Only): Domains -->
          <div id="instructor-domains-container" class="hidden">
            <label style="font-size: 0.875rem; font-weight: 600; margin-bottom: var(--spacing-sm); display: block;">Domaines d'enseignement :</label>
            <div id="reg-domains-list" class="domain-checkboxes">
              <p style="font-size: 0.85rem; color: var(--text-muted);">Chargement des compétences...</p>
            </div>
            <div class="form-group">
              <input type="text" id="reg-custom-domain" class="form-control" placeholder="+ Domaine libre (séparés par des virgules)" />
            </div>
          </div>

          <div style="display: flex; gap: var(--spacing-sm);">
            <button id="btn-reg-back-to-1" class="btn btn-secondary" style="flex: 1;">Retour</button>
            <button id="btn-submit-registration" class="btn btn-primary" style="flex: 2;">Valider</button>
          </div>
        </div>

        <div style="text-align: center; margin-top: var(--spacing-lg);">
          <button id="btn-back-to-choice-from-reg" class="btn btn-secondary" style="font-size: 0.85rem; padding: 0.5rem 1rem;">← Annuler</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ========================================== -->
  <!-- JAVASCRIPT APPLICATION LOGIC               -->
  <!-- ========================================== -->
  <script>
    const BASE_URL = "http://127.0.0.1:8000";
    let availableCompetencies = [];
    let selectedRole = "student";

    /* ===== DOM ELEMENTS ===== */
    const authChoiceView = document.getElementById("auth-choice-view");
    const authLoginView = document.getElementById("auth-login-view");
    const authRegisterView = document.getElementById("auth-register-view");
    const authAlert = document.getElementById("auth-alert");

    const roleChoiceStudent = document.getElementById("role-choice-student");
    const roleChoiceInstructor = document.getElementById("role-choice-instructor");
    const regStep1 = document.getElementById("register-step-1");
    const regStep2 = document.getElementById("register-step-2");
    const instructorDomainsContainer = document.getElementById("instructor-domains-container");
    const regDomainsList = document.getElementById("reg-domains-list");

    /* ===== UTILITY FUNCTIONS ===== */
    function showAlert(message, isSuccess = false) {
      authAlert.textContent = message;
      authAlert.className = isSuccess ? "alert alert-success" : "alert alert-error";
      authAlert.style.display = "flex";
    }

    function clearAlert() {
      authAlert.style.display = "none";
    }

    /* ===== AUTHENTICATION FLOW ===== */
    document.getElementById("btn-show-login").addEventListener("click", () => {
      clearAlert();
      authChoiceView.classList.add("hidden");
      authLoginView.classList.remove("hidden");
    });

    document.getElementById("btn-show-register").addEventListener("click", () => {
      clearAlert();
      authChoiceView.classList.add("hidden");
      authRegisterView.classList.remove("hidden");
      loadCompetenciesForRegistration();
    });

    document.getElementById("btn-back-to-choice-from-login").addEventListener("click", () => {
      clearAlert();
      authLoginView.classList.add("hidden");
      authChoiceView.classList.remove("hidden");
    });

    document.getElementById("btn-back-to-choice-from-reg").addEventListener("click", () => {
      clearAlert();
      authRegisterView.classList.add("hidden");
      authChoiceView.classList.remove("hidden");
    });

    roleChoiceStudent.addEventListener("click", () => {
      selectedRole = "student";
      roleChoiceStudent.classList.add("selected");
      roleChoiceInstructor.classList.remove("selected");
    });

    roleChoiceStudent.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        roleChoiceStudent.click();
      }
    });

    roleChoiceInstructor.addEventListener("click", () => {
      selectedRole = "instructor";
      roleChoiceInstructor.classList.add("selected");
      roleChoiceStudent.classList.remove("selected");
    });

    roleChoiceInstructor.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        roleChoiceInstructor.click();
      }
    });

    document.getElementById("btn-reg-to-step-2").addEventListener("click", () => {
      regStep1.classList.add("hidden");
      regStep2.classList.remove("hidden");
      document.getElementById("register-step-subtitle").textContent = 
        `Étape 2 : Identifiants (${selectedRole === "instructor" ? "Instructeur" : "Étudiant"})`;

      if (selectedRole === "instructor") {
        instructorDomainsContainer.classList.remove("hidden");
      } else {
        instructorDomainsContainer.classList.add("hidden");
      }
    });

    document.getElementById("btn-reg-back-to-1").addEventListener("click", () => {
      regStep2.classList.add("hidden");
      regStep1.classList.remove("hidden");
      document.getElementById("register-step-subtitle").textContent = "Étape 1 : Choisissez votre niveau d'accès";
    });

    async function loadCompetenciesForRegistration() {
      try {
        const res = await fetch(`${BASE_URL}/competencies`);
        if (res.ok) {
          const comps = await res.json();
          availableCompetencies = Array.isArray(comps) ? comps : (comps.competencies || []);
          regDomainsList.innerHTML = availableCompetencies.map(c => `
            <label class="checkbox-item">
              <input type="checkbox" name="domains" value="${c}" />
              <span>${c}</span>
            </label>
          `).join("");
        }
      } catch (err) {
        regDomainsList.innerHTML = `<p style="color: var(--danger); font-size: 0.8rem;">Erreur lors du chargement des compétences.</p>`;
      }
    }

    /* Login Handler */
    document.getElementById("form-login").addEventListener("submit", async (e) => {
      e.preventDefault();
      clearAlert();
      const email = document.getElementById("login-email").value.trim();
      const password = document.getElementById("login-password").value;

      const submitBtn = document.getElementById("login-submit-btn");
      submitBtn.disabled = true;
      submitBtn.textContent = "Connexion en cours...";

      try {
        const res = await fetch(`${BASE_URL}/login`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email: email, password: password })
        });

        if (!res.ok) {
          if (res.status === 401) {
            throw new Error("Email ou mot de passe incorrect.");
          }
          const errorData = await res.json().catch(() => ({}));
          throw new Error(errorData.detail || `Erreur serveur (${res.status})`);
        }

        const data = await res.json();
        
        // Store token and get user role from JWT
        const token = data.access_token;
        const role = getRoleFromToken(token);
        
        // Store in sessionStorage
        sessionStorage.setItem('access_token', token);
        sessionStorage.setItem('role', role);
        
        // Redirect based on role
        if (role === "student") {
          window.location.href = "student.html";
        } else if (role === "instructor") {
          window.location.href = "instructor.html";
        } else {
          throw new Error("Rôle utilisateur non reconnu.");
        }
        
      } catch (err) {
        if (err instanceof TypeError && (err.message.includes("fetch") || err.message.includes("NetworkError"))) {
          showAlert("Impossible de contacter le serveur. Vérifiez que l'API est démarrée.");
        } else {
          showAlert(err.message);
        }
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "Se connecter";
      }
    });

    /* Registration Handler */
    document.getElementById("btn-submit-registration").addEventListener("click", async () => {
      clearAlert();
      const fullname = document.getElementById("reg-fullname").value.trim();
      const email = document.getElementById("reg-email").value.trim();
      const password = document.getElementById("reg-password").value;
      const confirmPassword = document.getElementById("reg-password-confirm").value;

      if (!fullname || !email || !password) {
        showAlert("Veuillez renseigner tous les champs obligatoires.");
        return;
      }
      if (password !== confirmPassword) {
        showAlert("Les mots de passe ne correspondent pas.");
        return;
      }

      let domains = [];
      if (selectedRole === "instructor") {
        const checked = Array.from(document.querySelectorAll('input[name="domains"]:checked')).map(cb => cb.value);
        const custom = document.getElementById("reg-custom-domain").value.split(",").map(s => s.trim()).filter(Boolean);
        domains = [...new Set([...checked, ...custom])];
      }

      try {
        const res = await fetch(`${BASE_URL}/register`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            fullname: fullname,
            email: email,
            password: password,
            role: selectedRole,
            domains: domains
          })
        });

        const data = await res.json();
        if (!res.ok) {
          throw new Error(data.detail || "Échec de l'inscription.");
        }

        // Auto-login after registration
        const loginRes = await fetch(`${BASE_URL}/login`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email: email, password: password })
        });

        if (!loginRes.ok) {
          showAlert("Compte créé avec succès ! Veuillez vous connecter.", true);
          authRegisterView.classList.add("hidden");
          authLoginView.classList.remove("hidden");
          document.getElementById("login-email").value = email;
          document.getElementById("login-password").focus();
          return;
        }

        const loginData = await loginRes.json();
        const token = loginData.access_token;
        
        // Store in sessionStorage
        sessionStorage.setItem('access_token', token);
        sessionStorage.setItem('role', selectedRole);
        
        // Redirect based on role
        if (selectedRole === "student") {
          window.location.href = "student.html";
        } else if (selectedRole === "instructor") {
          window.location.href = "instructor.html";
        }
        
      } catch (err) {
        showAlert(err.message);
      }
    });

    /* Helper function to extract role from JWT token */
    function getRoleFromToken(token) {
      try {
        const base64Url = token.split('.')[1];
        const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
        const jsonPayload = decodeURIComponent(atob(base64).split('').map(function(c) {
          return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
        }).join(''));
        const payload = JSON.parse(jsonPayload);
        return payload.role;
      } catch (e) {
        console.error("Error decoding token:", e);
        return null;
      }
    }
  </script>
</body>
</html>
